name: Build and publish npm package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}. Update package.json before releasing.`);
          }
          JS

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Pack npm archive
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts

      - name: Verify installed package
        run: |
          install_dir=$(mktemp -d)
          npm install --prefix "$install_dir" --ignore-scripts --no-audit --no-fund "$PWD"/artifacts/*.tgz
          "$install_dir/node_modules/.bin/impact" --version
          "$install_dir/node_modules/.bin/impact" --help

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release' && github.repository == 'impact-relay/cli'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@impact-relay"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: artifacts
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish artifacts/*.tgz --ignore-scripts --tag "$NPM_TAG"
